<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b27">
  <meta name="description" content="一封写在冬至的祝福，愿你平安喜乐。">
  <title>冬至来信 · 平安喜乐</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f1e5;
      --muted: rgba(245, 241, 229, .74);
      --gold: #e9d7aa;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 42%, rgba(135, 167, 190, .31), transparent 39%),
        radial-gradient(ellipse at 12% 12%, rgba(104, 131, 151, .22), transparent 32%),
        radial-gradient(ellipse at 91% 86%, rgba(103, 126, 146, .24), transparent 36%),
        linear-gradient(145deg, #131c28 0%, #273745 47%, #111a25 100%);
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    }

    .scene {
      isolation: isolate;
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: max(26px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    .scene::before,
    .scene::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
      pointer-events: none;
    }

    .scene::before {
      opacity: .46;
      background:
        radial-gradient(ellipse at 4% 48%, rgba(235, 243, 247, .68), transparent 22%),
        radial-gradient(ellipse at 96% 49%, rgba(235, 243, 247, .62), transparent 24%),
        radial-gradient(ellipse at 50% 0%, rgba(222, 237, 245, .5), transparent 25%),
        radial-gradient(ellipse at 50% 100%, rgba(222, 237, 245, .38), transparent 23%);
      filter: blur(22px);
    }

    .scene::after {
      opacity: .28;
      background-image:
        radial-gradient(1px 1px at 16% 23%, #fff 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 83% 18%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 76% 74%, #fff 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 28% 80%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 54% 11%, #fff 50%, transparent 100%);
      background-size: 220px 210px, 280px 250px, 190px 240px, 310px 270px, 260px 230px;
    }

    #snow {
      position: fixed;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .letter {
      position: relative;
      width: min(100%, 610px);
      min-height: min(690px, calc(100svh - 64px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 48px 26px 42px;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(17, 27, 38, .63), rgba(29, 42, 53, .35) 53%, rgba(220, 234, 242, .1) 100%),
        linear-gradient(130deg, rgba(236, 244, 248, .22), rgba(55, 75, 91, .42) 34%, rgba(13, 24, 35, .5) 68%, rgba(236, 244, 248, .16));
      border: 1px solid rgba(245, 250, 252, .55);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .34), inset 0 0 48px rgba(244, 250, 253, .17);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      animation: arrive 1.2s cubic-bezier(.2,.7,.2,1) both;
    }

    .letter::before {
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(246, 250, 250, .23);
      content: "";
      pointer-events: none;
    }

    .letter::after {
      position: absolute;
      z-index: -1;
      inset: -10%;
      background:
        radial-gradient(ellipse at 7% 18%, rgba(245, 250, 252, .65), transparent 19%),
        radial-gradient(ellipse at 91% 80%, rgba(216, 232, 240, .42), transparent 22%),
        radial-gradient(ellipse at 80% 7%, rgba(229, 240, 244, .34), transparent 18%),
        radial-gradient(ellipse at 17% 88%, rgba(236, 245, 248, .36), transparent 21%);
      filter: blur(25px);
      content: "";
      pointer-events: none;
    }

    .seal {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      margin-bottom: 22px;
      color: rgba(255, 248, 228, .87);
      border: 1px solid rgba(242, 225, 190, .66);
      border-radius: 50%;
      font-size: 17px;
      line-height: 1;
      box-shadow: 0 0 24px rgba(244, 229, 198, .16);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: rgba(241, 239, 226, .75);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10px;
      letter-spacing: .38em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff8e6;
      font-size: clamp(45px, 12vw, 74px);
      font-weight: 400;
      letter-spacing: .11em;
      line-height: 1.35;
      text-shadow: 0 2px 20px rgba(255, 239, 202, .38), 0 0 46px rgba(245, 246, 239, .24);
      animation: glow 4.8s ease-in-out infinite alternate;
    }

    .divider {
      width: 46px;
      height: 1px;
      margin: 22px 0 20px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .message {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 3.3vw, 16px);
      letter-spacing: .22em;
      line-height: 2.1;
    }

    .signature {
      margin: 24px 0 0;
      color: rgba(244, 239, 220, .82);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: .31em;
    }

    .note {
      max-width: 280px;
      margin: 24px 0 0;
      color: rgba(244, 245, 240, .66);
      font-size: 12px;
      letter-spacing: .1em;
      line-height: 1.9;
    }

    .receive {
      min-height: 42px;
      margin-top: 30px;
      padding: 0 21px;
      color: rgba(255, 248, 230, .9);
      background: rgba(235, 242, 242, .08);
      border: 1px solid rgba(242, 239, 224, .38);
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      letter-spacing: .13em;
      cursor: pointer;
      transition: background .25s ease, transform .25s ease, border-color .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .receive:active { transform: scale(.97); }
    .receive:hover { background: rgba(235, 242, 242, .17); border-color: rgba(242, 239, 224, .68); }
    .receive:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

    .toast {
      min-height: 19px;
      margin-top: 12px;
      color: rgba(255, 248, 230, .8);
      font-size: 11px;
      letter-spacing: .1em;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .toast.visible { opacity: 1; }

    .bottom-mark {
      position: absolute;
      right: 0;
      bottom: 17px;
      left: 0;
      color: rgba(240, 244, 242, .47);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 9px;
      letter-spacing: .32em;
      text-align: center;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(16px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes glow {
      from { text-shadow: 0 2px 18px rgba(255, 239, 202, .28), 0 0 34px rgba(245, 246, 239, .18); }
      to { text-shadow: 0 2px 24px rgba(255, 239, 202, .51), 0 0 56px rgba(245, 246, 239, .3); }
    }

    @media (max-width: 420px) {
      .scene { padding-right: 14px; padding-left: 14px; }
      .letter { min-height: min(650px, calc(100svh - 48px)); padding: 40px 20px 34px; }
      .bottom-mark { bottom: 11px; }
    }

    @media (max-height: 650px) {
      .letter { min-height: calc(100svh - 48px); padding-top: 24px; padding-bottom: 24px; }
      .seal { margin-bottom: 12px; }
      .divider { margin: 14px 0; }
      .signature, .note { margin-top: 14px; }
      .receive { margin-top: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <canvas id="snow" aria-hidden="true"></canvas>
    <article class="letter" aria-label="冬至祝福">
      <div class="seal" aria-hidden="true">冬</div>
      <p class="eyebrow">A WINTER LETTER</p>
      <h1>冬至降临</h1>
      <div class="divider" aria-hidden="true"></div>
      <p class="message">平安喜乐<br>祝你、祝我、祝我们</p>
      <p class="signature">ZHAIXINGCHEN</p>
      <p class="note">愿这个冬天，有热汤、有拥抱，<br>也有想见的人在身旁。</p>
      <button class="receive" id="receive" type="button">收下这份祝福</button>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </article>
    <div class="bottom-mark">WINTER SOLSTICE · 2026</div>
  </main>

  <script>
    // 在这里改祝福文案和署名，保存后重新上传即可更新网页。
    const wishes = {
      title: "冬至降临",
      message: ["平安喜乐", "祝你、祝我、祝我们"],
      signature: "ZHAIXINGCHEN",
      note: ["愿这个冬天，有热汤、有拥抱，", "也有想见的人在身旁。"]
    };

    document.querySelector("h1").textContent = wishes.title;
    document.querySelector(".message").innerHTML = wishes.message.map(line => `<span>${line}</span>`).join("<br>");
    document.querySelector(".signature").textContent = wishes.signature;
    document.querySelector(".note").innerHTML = wishes.note.map(line => `<span>${line}</span>`).join("<br>");

    const button = document.getElementById("receive");
    const toast = document.getElementById("toast");
    button.addEventListener("click", () => {
      toast.textContent = "愿这份祝福，陪你度过整个冬天 ✦";
      toast.classList.add("visible");
      button.textContent = "祝福已收好";
    });

    const canvas = document.getElementById("snow");
    const ctx = canvas.getContext("2d");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let flakes = [];
    let width = 0;
    let height = 0;
    let frame = 0;

    function resizeSnow() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const count = Math.min(60, Math.max(26, Math.round(width / 7)));
      flakes = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.8 + .45,
        speed: Math.random() * .55 + .18,
        drift: (Math.random() - .5) * .34,
        alpha: Math.random() * .47 + .18
      }));
      drawSnow();
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      for (const flake of flakes) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(248, 250, 249, ${flake.alpha})`;
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fill();

        if (!reduceMotion) {
          flake.y += flake.speed;
          flake.x += flake.drift + Math.sin((flake.y + flake.x) / 58) * .17;
          if (flake.y > height + 4) {
            flake.y = -4;
            flake.x = Math.random() * width;
          }
          if (flake.x < -4) flake.x = width + 4;
          if (flake.x > width + 4) flake.x = -4;
        }
      }

      if (!reduceMotion) {
        frame = window.requestAnimationFrame(drawSnow);
      }
    }

    window.addEventListener("resize", () => {
      window.cancelAnimationFrame(frame);
      resizeSnow();
    }, { passive: true });

    resizeSnow();
  </script>
</body>
</html>
